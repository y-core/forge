# Publishes the packed tarball a consumer installs, on every `v*` tag.
#
# `forge release` bumps the version, promotes the changelog, commits and tags — it never pushes, so
# the tag arrives here from whoever pushed it. This workflow is the other half: it packs the tag and
# attaches the result to a GitHub Release.
#
# The tarball is `bun pm pack`, so `files` in package.json is the single manifest deciding what a
# consumer receives. That is the whole point of releasing an asset rather than pointing consumers at
# `codeload`, which serves a git snapshot and honours no manifest at all.

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its protection rules (who may approve, which tags may deploy) are a repository setting, not this file.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `packageManager` in package.json, not `latest`: a floating runtime makes the gate that guards
      # a release a different gate from the one `forge release` ran locally, and the difference
      # surfaces as a red tag. `engines.bun` is a consumer floor and a range, so it pins nothing.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: install
        run: bun install --frozen-lockfile

      # A tag whose tree carries a different version would publish an asset nobody can resolve from
      # the tag name, so it is refused before anything is built.
      - name: check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Pinned to the installed `@playwright/test`: the gate refuses a server on any other version. Started by
      # hand because a service container takes no command, and this image's default command is a shell.
      - name: start playwright server
        run: |
          docker run -d --name playwright --init --ipc=host -p 3000:3000 mcr.microsoft.com/playwright:v1.64.1-noble \
            npx -y playwright@1.64.1 run-server --port 3000 --host 0.0.0.0 --max-clients "$PLAYWRIGHT_SERVER_MAX_CLIENTS"
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null; do sleep 1; done'
        env:
          PLAYWRIGHT_SERVER_MAX_CLIENTS: "4"

      # `deploy`: every runtime suite whole, on Chromium; `verify:release` adds the engine matrix before the tag is cut
      - name: verify
        run: bun run verify:deploy
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
          PW_TEST_CONNECT_EXPOSE_NETWORK: <loopback>
          PLAYWRIGHT_SERVER_MAX_CLIENTS: "4"

      - name: pack
        run: bun pm pack --filename "y-core-forge-${VERSION}.tgz"

      - name: attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: y-core-forge-${{ env.VERSION }}.tgz

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "y-core-forge-${VERSION}.tgz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
