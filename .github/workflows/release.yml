# Publishes the packed tarball a consumer installs, on every `v*` tag.
#
# `forge release` bumps the version, promotes the changelog, commits and tags — it never pushes, so
# the tag arrives here from whoever pushed it. This workflow is the other half: it packs the tag and
# attaches the result to a GitHub Release.
#
# The tarball is `bun pm pack`, so `files` in package.json is the single manifest deciding what a
# consumer receives. That is the whole point of releasing an asset rather than pointing consumers at
# `codeload`, which serves a git snapshot and honours no manifest at all.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      # A tag whose tree carries a different version would publish an asset nobody can resolve from
      # the tag name, so it is refused before anything is built.
      - name: check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The browser set's prerequisite. Workerd arrives transitively with wrangler, so Chromium is
      # the only thing `verify:full` needs that `bun install` does not already bring.
      - name: install chromium
        run: bunx playwright install --with-deps chromium

      # A backstop, not the gate that decides the release: `forge release` runs this same command
      # before it cuts the tag, because by the time it fails here the tag is already fetchable.
      - name: verify
        run: bun run verify:full

      - name: pack
        run: bun pm pack --filename "y-core-forge-${VERSION}.tgz"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "y-core-forge-${VERSION}.tgz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
